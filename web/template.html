<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>__SITE_TITLE__</title>
<style>
:root {
  --bg: #ffffff; --ink: #121212; --muted: #5a5a5a; --rule: #dfdfdf; --link: #326891;
  --soft: #f4f2ee; --serif: Georgia, "Noto Serif", "Times New Roman", serif;
  --sans: "Helvetica Neue", Helvetica, Arial, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --ink: #ede9e3; --muted: #aaa6a0; --rule: #3a3a3a; --link: #8db4d8; --soft: #1c1c1c;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --ink: #ede9e3; --muted: #aaa6a0; --rule: #3a3a3a; --link: #8db4d8; --soft: #1c1c1c;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); line-height: 1.45; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* Masthead */
.masthead { text-align: center; padding: 22px 0 0; }
.masthead h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; }
.rules { margin: 14px 0 0; border-top: 3px solid var(--ink); height: 5px; border-bottom: 1px solid var(--ink); }
.dateline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0;
  font: 600 .72rem/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--rule); }
.dateline span:last-child { color: var(--muted); font-weight: 500; }

/* Toolbar */
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
.toolbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-top: 10px; padding-bottom: 10px; font-family: var(--sans); font-size: .85rem; }
.toolbar input[type=search], .toolbar select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 8px; min-width: 0; }
.toolbar input[type=search] { flex: 1 1 220px; }
.toolbar select { max-width: 220px; }
.toolbar label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.toolbar button { font: inherit; color: inherit; background: none; border: 1px solid var(--rule); border-radius: 2px; padding: 6px 10px; cursor: pointer; }
.toolbar button:hover { background: var(--soft); }

/* Articles */
.kicker { font: 700 .68rem/1.2 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.kicker em { font-style: normal; color: var(--link); }
.title { font-weight: 700; margin: 0; line-height: 1.18; }
.title a:hover { text-decoration: underline; }
.orig { margin: 4px 0 0; font-style: italic; font-size: .85rem; color: var(--muted); }
.summary { margin: 8px 0 0; color: var(--muted); font-size: .98rem; }
.meta { margin: 8px 0 0; font: .72rem/1.3 var(--sans); color: var(--muted); }
.thumb { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--soft); margin-bottom: 10px; }
article.read .title a, article.read .summary { opacity: .55; }

.front { display: grid; grid-template-columns: 2fr 1fr; gap: 0 28px; padding: 22px 0 6px; border-bottom: 1px solid var(--ink); }
.lead { padding-right: 28px; border-right: 1px solid var(--rule); padding-bottom: 20px; }
.lead .thumb { aspect-ratio: 16 / 9; }
.lead .title { font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
.lead .summary { font-size: 1.1rem; }
.rail article { padding: 0 0 16px; margin: 0 0 16px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr 96px; gap: 0 12px; }
.rail article:last-child { border-bottom: 0; margin-bottom: 0; }
.rail .title { font-size: 1.12rem; }
.rail article > * { grid-column: 1; }
.rail article > .thumb { grid-column: 2; grid-row: 1 / span 4; aspect-ratio: 1; margin: 0; }
.rail .summary { display: none; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 28px; padding-top: 6px; }
.grid article { padding: 18px 0; border-bottom: 1px solid var(--rule); }
.grid .title { font-size: 1.22rem; }

.more { display: block; margin: 26px auto 10px; font: 600 .85rem var(--sans); padding: 10px 22px; background: none; color: inherit; border: 1px solid var(--ink); border-radius: 2px; cursor: pointer; }
.more:hover { background: var(--ink); color: var(--bg); }
.empty { text-align: center; color: var(--muted); padding: 60px 0; font-style: italic; }
footer { font: .75rem/1.5 var(--sans); color: var(--muted); text-align: center; padding: 28px 0 40px; }

/* Lock screen */
.lock { max-width: 360px; margin: 60px auto; text-align: center; font-family: var(--sans); }
.lock input[type=password] { width: 100%; font: 1rem var(--sans); padding: 10px; border: 1px solid var(--ink); border-radius: 2px; background: var(--bg); color: var(--ink); }
.lock button { margin-top: 12px; width: 100%; padding: 10px; font: 600 .95rem var(--sans); background: var(--ink); color: var(--bg); border: 0; border-radius: 2px; cursor: pointer; }
.lock label { display: flex; justify-content: center; gap: 6px; margin-top: 12px; font-size: .8rem; color: var(--muted); }
.lock .err { color: #c5221f; min-height: 1.3em; margin-top: 10px; font-size: .85rem; }

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .front { grid-template-columns: 1fr; }
  .lead { padding-right: 0; border-right: 0; border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
}
@media (max-width: 560px) {
  .toolbar { position: static; }
  .grid { grid-template-columns: 1fr; }
  .wrap { padding: 0 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 id="site-title">__SITE_TITLE__</h1>
    <div class="rules"></div>
    <div class="dateline"><span id="today"></span><span id="updated"></span></div>
  </header>
</div>
<div id="app"></div>
<noscript><p class="empty">Trang này cần JavaScript để hiển thị.</p></noscript>
<script>
const PAYLOAD = /*__PAYLOAD__*/null;
(function () {
  'use strict';

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ } },
    del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
  };

  function h(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === false || value == null) continue;
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      node.append(child.nodeType ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  const app = document.getElementById('app');

  /* ---------- theme ---------- */
  const root = document.documentElement;
  const savedTheme = store.get('db_theme');
  if (savedTheme === 'light' || savedTheme === 'dark') root.setAttribute('data-theme', savedTheme);
  function toggleTheme() {
    const dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    store.set('db_theme', next);
  }

  /* ---------- masthead date ---------- */
  document.getElementById('today').textContent =
    new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  /* ---------- helpers ---------- */
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
  const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : '#');

  function ago(iso) {
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 3600) return Math.max(1, Math.round(diff / 60)) + ' phút trước';
    if (diff < 86400) return Math.round(diff / 3600) + ' giờ trước';
    if (diff < 2 * 86400) return 'Hôm qua';
    if (diff < 7 * 86400) return Math.round(diff / 86400) + ' ngày trước';
    return new Date(iso).toLocaleDateString('vi-VN');
  }

  /* ---------- decrypt ---------- */
  async function decrypt(password) {
    const raw = Uint8Array.from(atob(PAYLOAD.b64), (c) => c.charCodeAt(0));
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function showLock() {
    const err = h('div', { class: 'err', role: 'alert' });
    const input = h('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Mật khẩu', 'aria-label': 'Mật khẩu', autofocus: true });
    const remember = h('input', { type: 'checkbox' });
    const button = h('button', { type: 'submit' }, 'Mở');
    const form = h('form', { class: 'lock' },
      h('p', {}, 'Trang này được bảo vệ bằng mật khẩu.'), input, err, button,
      h('label', {}, remember, 'Nhớ trên máy này'));
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      err.textContent = '';
      button.disabled = true;
      button.textContent = 'Đang giải mã…';
      try {
        const data = await decrypt(input.value);
        if (remember.checked) store.set('db_pw', input.value);
        start(data);
      } catch (e) {
        err.textContent = 'Sai mật khẩu.';
        button.disabled = false;
        button.textContent = 'Mở';
      }
    });
    app.replaceChildren(form);
    input.focus();
  }

  /* ---------- reader ---------- */
  function start(data) {
    document.getElementById('site-title').textContent = data.title || document.title;
    document.getElementById('updated').textContent =
      'Cập nhật ' + new Date(data.generated).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });

    const items = data.items || [];
    let readSet = new Set();
    try { readSet = new Set(JSON.parse(store.get('db_read') || '[]')); } catch (e) { /* ignore */ }
    const markRead = (id, node) => {
      readSet.add(id);
      store.set('db_read', JSON.stringify([...readSet].slice(-3000)));
      node.classList.add('read');
    };

    const state = { q: '', cat: '', src: '', original: false, hideRead: false, shown: 60 };
    const categories = [...new Set(items.map((i) => i.cat).filter(Boolean))].sort();
    const sources = [...new Set(items.map((i) => i.src))].sort((a, b) => a.localeCompare(b));
    const catLabel = (c) => c.replace(/^(EN|VN)\s*-\s*/i, (m) => m.trim().toUpperCase().startsWith('EN') ? 'EN · ' : 'VN · ').replace(/ - /, ' · ');

    const main = h('main', { class: 'wrap' });
    const rerender = () => { state.shown = 60; render(); };

    const search = h('input', { type: 'search', placeholder: 'Tìm trong tiêu đề và tóm tắt…', 'aria-label': 'Tìm kiếm',
      oninput: (e) => { state.q = norm(e.target.value); rerender(); } });
    const catSelect = h('select', { 'aria-label': 'Chủ đề', onchange: (e) => { state.cat = e.target.value; rerender(); } },
      h('option', { value: '' }, 'Tất cả chủ đề'), categories.map((c) => h('option', { value: c }, c)));
    const srcSelect = h('select', { 'aria-label': 'Nguồn', onchange: (e) => { state.src = e.target.value; rerender(); } },
      h('option', { value: '' }, 'Tất cả nguồn'), sources.map((s) => h('option', { value: s }, s)));
    const origBox = h('input', { type: 'checkbox', onchange: (e) => { state.original = e.target.checked; render(); } });
    const readBox = h('input', { type: 'checkbox', onchange: (e) => { state.hideRead = e.target.checked; rerender(); } });

    const toolbar = h('div', { class: 'toolbar' }, h('div', { class: 'wrap' },
      search, catSelect, srcSelect,
      h('label', {}, origBox, 'Hiện bản gốc'),
      h('label', {}, readBox, 'Ẩn bài đã đọc'),
      h('button', { type: 'button', title: 'Đổi giao diện sáng/tối', 'aria-label': 'Đổi giao diện sáng/tối', onclick: toggleTheme }, 'Sáng/Tối')));

    const footer = h('footer', {}, h('div', { class: 'wrap' },
      'Chỉ hiển thị tiêu đề và tóm tắt, đọc toàn văn tại trang nguồn. Bản dịch do AI tạo nên có thể có sai sót.'));

    app.replaceChildren(toolbar, main, footer);

    function matches(item) {
      if (state.cat && item.cat !== state.cat) return false;
      if (state.src && item.src !== state.src) return false;
      if (state.hideRead && readSet.has(item.id)) return false;
      if (state.q) {
        const haystack = norm([item.t, item.title, item.s, item.summary, item.src].join(' '));
        return state.q.split(/\s+/).every((word) => haystack.includes(word));
      }
      return true;
    }

    function articleEl(item, withImage) {
      const translated = Boolean(item.t);
      const link = h('a', { href: safeUrl(item.link), target: '_blank', rel: 'noopener noreferrer' }, item.t || item.title);
      let image = null;
      if (withImage && item.img) {
        image = h('img', { class: 'thumb', src: item.img, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
        image.addEventListener('error', () => image.remove());
      }
      const summary = item.s || item.summary;
      const article = h('article', { class: readSet.has(item.id) ? 'read' : '' },
        image,
        h('p', { class: 'kicker' }, item.src, translated ? null : [' · ', h('em', {}, 'chưa dịch')]),
        h('h2', { class: 'title' }, link),
        state.original && translated && item.t !== item.title ? h('p', { class: 'orig' }, item.title) : null,
        summary ? h('p', { class: 'summary' }, summary) : null,
        h('p', { class: 'meta' }, ago(item.date), item.cat ? ' · ' + catLabel(item.cat) : ''));
      const onOpen = () => markRead(item.id, article);
      link.addEventListener('click', onOpen);
      link.addEventListener('auxclick', onOpen);
      return article;
    }

    function render() {
      const list = items.filter(matches);
      main.replaceChildren();
      if (!list.length) {
        main.append(h('p', { class: 'empty' }, 'Không có bài nào khớp.'));
        return;
      }
      const visible = list.slice(0, state.shown);
      const leadIndex = Math.max(0, visible.slice(0, 8).findIndex((i) => i.img));
      const lead = visible[leadIndex];
      const others = visible.filter((_, index) => index !== leadIndex);
      const rail = others.slice(0, 4);
      const rest = others.slice(4);

      const front = h('section', { class: 'front' },
        h('div', { class: 'lead' }, articleEl(lead, true)),
        h('div', { class: 'rail' }, rail.map((i) => articleEl(i, true))));
      main.append(front);
      if (rest.length) main.append(h('section', { class: 'grid' }, rest.map((i) => articleEl(i, true))));
      if (list.length > visible.length) {
        main.append(h('button', { class: 'more', type: 'button', onclick: () => { state.shown += 60; render(); } },
          'Xem thêm (' + (list.length - visible.length) + ')'));
      }
    }
    render();
  }

  /* ---------- entry ---------- */
  if (!PAYLOAD) {
    app.append(h('p', { class: 'empty' }, 'Chưa có dữ liệu.'));
  } else if (PAYLOAD.mode === 'plain') {
    start(PAYLOAD.data);
  } else {
    const saved = store.get('db_pw');
    if (saved) {
      decrypt(saved).then(start).catch(() => { store.del('db_pw'); showLock(); });
    } else {
      showLock();
    }
  }
})();
</script>
</body>
</html>
