name: Build APK

# Tự chạy mỗi khi bạn đẩy code lên nhánh main, hoặc chạy tay: Actions -> Build APK -> Run workflow
on:
  push:
    branches: [main]
    # Sửa trang web không cần build lại APK
    paths-ignore:
      - "web/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # cần để đăng bản phát hành (Releases)
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: make gradlew executable
        run: chmod +x ./gradlew

      # Chỉ để xem lỗi định dạng code, không chặn việc build APK
      - name: ktlint (không bắt buộc)
        continue-on-error: true
        run: ./gradlew ktlintCheck

      # APK debug luôn được ký bằng shareddebug.keystore trong repo,
      # nên mọi bản build đều cài đè được lên nhau và giữ nguyên dữ liệu.
      - name: build debug apk
        run: ./gradlew assembleFdroidDebug -PupdateRepo=${{ github.repository }} -PbuildCommit=${{ github.sha }}

      - name: upload apk (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: diembao-apk
          retention-days: 30
          path: app/build/outputs/apk/fdroid/debug/*.apk

      # Đăng APK lên Releases với tên cố định để tải thẳng trên điện thoại
      - name: publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/fdroid/debug/*.apk diembao-latest.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest diembao-latest.apk \
            --title "Diembao - bản mới nhất" \
            --notes "Build từ commit ${{ github.sha }}" \
            --latest
